<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">CI and container publishing pipeline</title><desc id="d">GitHub push and pull requests trigger checkout, Python setup, dependency install, and pytest. Pushes to main continue to Docker Buildx and GHCR publishing.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#94a3b8"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}.h{font-size:29px;font-weight:700}.k{font-size:19px;font-weight:650}.b{font-size:15px;fill:#cbd5e1}.box{fill:#172033;stroke:#64748b;stroke-width:2}.test{fill:#102d3d;stroke:#38bdf8}.pub{fill:#1b2e25;stroke:#34d399}.line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="500" rx="24" fill="#0b1220"/><text x="52" y="62" class="h">CI → Container publishing</text><text x="52" y="94" class="b">Defined in .github/workflows/ci-cd.yml</text><rect x="48" y="170" width="180" height="120" rx="16" class="box"/><text x="138" y="210" text-anchor="middle" class="k">GitHub event</text><text x="138" y="242" text-anchor="middle" class="b">push / PR</text><rect x="285" y="170" width="190" height="120" rx="16" class="test"/><text x="380" y="210" text-anchor="middle" class="k">Checkout</text><text x="380" y="242" text-anchor="middle" class="b">Python 3.12 setup</text><rect x="530" y="170" width="190" height="120" rx="16" class="test"/><text x="625" y="210" text-anchor="middle" class="k">Install</text><text x="625" y="242" text-anchor="middle" class="b">requirements.txt</text><rect x="775" y="170" width="170" height="120" rx="16" class="test"/><text x="860" y="210" text-anchor="middle" class="k">Test</text><text x="860" y="242" text-anchor="middle" class="b">pytest -q</text><path d="M228 230H275M475 230H520M720 230H765" class="line"/><path d="M860 290V355H670" class="line"/><text x="860" y="338" class="b">main branch only</text><rect x="470" y="355" width="190" height="100" rx="16" class="pub"/><text x="565" y="395" text-anchor="middle" class="k">Docker Buildx</text><text x="565" y="425" text-anchor="middle" class="b">Build image</text><rect x="760" y="355" width="250" height="100" rx="16" class="pub"/><text x="885" y="395" text-anchor="middle" class="k">GitHub Container</text><text x="885" y="425" text-anchor="middle" class="b">Registry (GHCR)</text><path d="M660 405H750" class="line"/><text x="52" y="420" class="b">Pull requests run tests; publishing job is skipped.</text><text x="52" y="448" class="b">No automatic deployment to Minikube is configured.</text></svg>