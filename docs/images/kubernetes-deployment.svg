<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Kubernetes deployment layout</title><desc id="d">A ClusterIP service routes traffic to two cloudops-api pods in a Deployment, each with health probes and resource limits.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#94a3b8"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}.h{font-size:29px;font-weight:700}.k{font-size:21px;font-weight:650}.b{font-size:16px;fill:#cbd5e1}.frame{fill:#111827;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}.svc{fill:#172554;stroke:#60a5fa;stroke-width:2}.pod{fill:#052e2b;stroke:#2dd4bf;stroke-width:2}.line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="540" rx="24" fill="#0b1220"/><text x="52" y="62" class="h">Kubernetes · local Minikube deployment</text><text x="52" y="94" class="b">kubernetes/deployment.yaml · kubernetes/service.yaml</text><rect x="60" y="150" width="230" height="110" rx="16" class="svc"/><text x="175" y="192" text-anchor="middle" class="k">Client traffic</text><text x="175" y="224" text-anchor="middle" class="b">Service port 80</text><rect x="360" y="130" width="780" height="350" rx="20" class="frame"/><text x="390" y="170" class="k">Deployment: cloudops-api · replicas = 2</text><rect x="410" y="220" width="300" height="205" rx="16" class="pod"/><text x="560" y="258" text-anchor="middle" class="k">Pod 1 · API</text><text x="560" y="292" text-anchor="middle" class="b">Container port 5000</text><text x="560" y="326" text-anchor="middle" class="b">/healthz probes</text><text x="560" y="360" text-anchor="middle" class="b">CPU 100m–500m</text><text x="560" y="390" text-anchor="middle" class="b">Memory 64–256Mi</text><rect x="790" y="220" width="300" height="205" rx="16" class="pod"/><text x="940" y="258" text-anchor="middle" class="k">Pod 2 · API</text><text x="940" y="292" text-anchor="middle" class="b">Container port 5000</text><text x="940" y="326" text-anchor="middle" class="b">/healthz probes</text><text x="940" y="360" text-anchor="middle" class="b">CPU 100m–500m</text><text x="940" y="390" text-anchor="middle" class="b">Memory 64–256Mi</text><path d="M290 205H345M345 205V320H400M345 320H780" class="line"/><text x="600" y="510" text-anchor="middle" class="b">Non-root user · read-only root filesystem · no privilege escalation · all capabilities dropped</text></svg>