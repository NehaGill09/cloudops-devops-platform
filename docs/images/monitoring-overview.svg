<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Monitoring dashboard overview</title><desc id="d">Illustrative layout of the provisioned Grafana dashboard, with HTTP request rate and process memory panels fed by Prometheus scraping the API metrics endpoint.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}.h{font-size:29px;font-weight:700}.k{font-size:19px;font-weight:650}.b{font-size:15px;fill:#cbd5e1}.muted{fill:#94a3b8;font-size:13px}.panel{fill:#111827;stroke:#475569;stroke-width:2}.grid{stroke:#334155;stroke-width:1}.curve{fill:none;stroke:#38bdf8;stroke-width:4}.curve2{fill:none;stroke:#a78bfa;stroke-width:4}.pill{fill:#052e2b;stroke:#2dd4bf;stroke-width:1.5}</style><rect width="1200" height="600" rx="24" fill="#0b1220"/><text x="52" y="62" class="h">Monitoring · CloudOps API Overview</text><text x="52" y="94" class="b">Illustrative dashboard layout based on grafana/dashboards/cloudops-overview.json</text><rect x="52" y="130" width="1096" height="400" rx="18" class="panel"/><rect x="82" y="160" width="1036" height="54" rx="10" class="pill"/><text x="106" y="194" class="k">Prometheus datasource connected · scrape interval 15s</text><rect x="82" y="242" width="495" height="250" rx="14" class="panel"/><text x="108" y="280" class="k">HTTP requests per second</text><text x="108" y="304" class="muted">sum(rate(flask_http_request_total[5m]))</text><path d="M110 445H548M110 395H548M110 345H548M110 325V455" class="grid"/><path d="M112 425L155 412L198 420L241 365L284 382L327 345L370 370L413 330L456 352L500 318L548 335" class="curve"/><rect x="603" y="242" width="495" height="250" rx="14" class="panel"/><text x="629" y="280" class="k">Process memory</text><text x="629" y="304" class="muted">process_resident_memory_bytes</text><path d="M631 445H1069M631 395H1069M631 345H1069M631 325V455" class="grid"/><path d="M633 410L676 406L719 399L762 400L805 382L848 385L891 370L934 373L977 360L1020 354L1068 348" class="curve2"/><text x="600" y="568" text-anchor="middle" class="b">Conceptual preview only — chart lines are illustrative, not live telemetry or measured values.</text></svg>