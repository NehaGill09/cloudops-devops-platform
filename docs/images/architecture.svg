<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">CloudOps platform architecture</title><desc id="d">Developer workflow, GitHub Actions, local Docker Compose or Minikube runtime, and Prometheus and Grafana monitoring.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}.h{font-size:30px;font-weight:700}.s{font-size:17px;fill:#cbd5e1}.k{font-size:21px;font-weight:650}.b{font-size:16px;fill:#cbd5e1}.panel{fill:#111827;stroke:#475569;stroke-width:2}.node{fill:#1e293b;stroke:#64748b;stroke-width:1.5}.blue{fill:#172554;stroke:#60a5fa}.green{fill:#052e2b;stroke:#2dd4bf}.purple{fill:#2e1065;stroke:#c084fc}.line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="680" rx="24" fill="#0b1220"/><text x="56" y="62" class="h">CloudOps DevOps Platform</text><text x="56" y="94" class="s">High-level architecture · local demo environment</text><rect x="48" y="132" width="250" height="150" rx="18" class="panel"/><text x="72" y="169" class="k">Developer</text><rect x="72" y="190" width="202" height="62" rx="12" class="node"/><text x="173" y="216" text-anchor="middle" class="b">Code + Git push</text><text x="173" y="239" text-anchor="middle" class="b">Pull request</text><rect x="365" y="132" width="300" height="150" rx="18" class="panel"/><text x="389" y="169" class="k">GitHub</text><rect x="389" y="190" width="252" height="62" rx="12" class="blue"/><text x="515" y="216" text-anchor="middle" class="b">GitHub Actions</text><text x="515" y="239" text-anchor="middle" class="b">pytest → Docker build</text><rect x="730" y="132" width="420" height="150" rx="18" class="panel"/><text x="754" y="169" class="k">Container registry</text><rect x="754" y="190" width="372" height="62" rx="12" class="purple"/><text x="940" y="216" text-anchor="middle" class="b">GHCR image publish</text><text x="940" y="239" text-anchor="middle" class="b">main branch push only</text><path d="M298 220H355M665 220H720" class="line"/><rect x="48" y="350" width="1102" height="270" rx="20" class="panel"/><text x="76" y="390" class="k">Local runtime · choose either path</text><rect x="82" y="425" width="420" height="150" rx="16" class="green"/><text x="106" y="461" class="k">Docker Compose</text><text x="106" y="497" class="b">Flask API · :5000</text><text x="106" y="526" class="b">Prometheus · :9090</text><text x="106" y="555" class="b">Grafana · :3000</text><rect x="570" y="425" width="535" height="150" rx="16" class="blue"/><text x="594" y="461" class="k">Minikube / Kubernetes</text><text x="594" y="497" class="b">Service → Deployment (2 API replicas)</text><text x="594" y="526" class="b">/healthz readiness + liveness probes</text><text x="594" y="555" class="b">Prometheus scrapes /metrics</text><path d="M940 282V320H292V415M940 320H838V415" class="line"/><text x="600" y="652" text-anchor="middle" class="s">Monitoring: Prometheus collects metrics · Grafana visualizes the provisioned dashboard</text></svg>