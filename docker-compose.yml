services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cloudops-api:1.0.0
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      SECRET_KEY: "local-demo-only"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped
